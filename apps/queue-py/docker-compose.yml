# =============================================================================
# Docker Compose — local development
# =============================================================================
# Start the Python queue worker locally.
# Usage: docker compose -f apps/queue-py/docker-compose.yml up

services:
  worker:
    build:
      context: ../..
      dockerfile: apps/queue-py/Dockerfile
    environment:
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - INFERENCE_API_URL=${INFERENCE_API_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped