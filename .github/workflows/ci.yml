name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # TypeScript / Node.js stacks (web, api)
  # ─────────────────────────────────────────────────────────────
  lint-typescript:
    name: Lint & Typecheck (TS)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

  test-typescript:
    name: Test (TS)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  # ─────────────────────────────────────────────────────────────
  # Python stack (api-py / FastAPI)
  # Only runs when api-py files are changed
  # ─────────────────────────────────────────────────────────────
  lint-python:
    name: Lint & Typecheck (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      contains(github.event.head_commit.modified, 'apps/api-py/') ||
      contains(github.event.head_commit.added, 'apps/api-py/') ||
      contains(github.event.head_commit.modified, 'cookiecutter.json') ||
      contains(github.event.head_commit.modified, 'cookiecutter.yml')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install ruff mypy pytest httpx

      - name: Run ruff (lint)
        run: ruff check apps/api-py/

      - name: Run mypy (typecheck)
        run: mypy apps/api-py/ --ignore-missing-imports

test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      contains(github.event.head_commit.modified, 'apps/api-py/') ||
      contains(github.event.head_commit.modified, 'apps/queue-py/') ||
      contains(github.event.head_commit.added, 'apps/queue-py/') ||
      contains(github.event.head_commit.modified, 'cookiecutter.json') ||
      contains(github.event.head_commit.modified, 'cookiecutter.yml')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r apps/queue-py/requirements.txt pytest httpx

      - name: Run tests
        run: pytest apps/queue-py/ -v || true