name: Deploy All

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: deploy-all
  cancel-in-progress: true

jobs:
  vercel:
    name: Deploy Vercel (Web + API)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger Vercel Deploy
        uses: actions/checkout@v4

      - name: Deploy via Vercel GitHub Action
        uses: ./.github/workflows/deploy-vercel.yml
        secrets:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VERDA_API_URL: ${{ secrets.NEXT_PUBLIC_VERDA_API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERDA_API_KEY: ${{ secrets.VERDA_API_KEY }}

  cloudrun:
    name: Deploy Cloud Run (Inference)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger Cloud Run Deploy
        uses: actions/checkout@v4

      - name: Deploy via Cloud Run GitHub Action
        uses: ./.github/workflows/deploy-cloudrun.yml
        secrets:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          VERDA_API_KEY: ${{ secrets.VERDA_API_KEY }}
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

  post-deploy:
    name: Post-Deploy Notification
    needs: [vercel, cloudrun]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Announce Success
        run: |
          echo "Deployment complete!"
          echo "Vercel: https://${{ vars.VERCEL_PROJECT_SLUG }}.vercel.app"
          echo "Cloud Run: https://inference-service-${{ vars.GCP_PROJECT_ID }}.run.app"
