[project]
name = "defence-hack-backend"
version = "0.1.0"
description = "Backend API for defence_hack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "httpx==0.28.1",
  "redis[asyncio]==5.2.1",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "shapely==2.0.6",
  "pyproj==3.6.1",
  "pandas>=2.2.0",
  "pyarrow>=15.0.0",
  "rasterio>=1.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false
